# Adanac Website CI/CD
#
# CI:  lint + tests on every push and PR
# CD:  handled by native Vercel-GitHub integration (productionBranch = main)
#      on the corporate org repo — the GitHub Action deploy job was removed
#      on repo transfer to avoid double deploys.

# ── Prerequisites ────────────────────────────────────────────────────────────
#   SENTRY_DSN — Sentry dashboard → Settings → Projects → Client Keys (DSN)

name: CI/CD

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  # ── CI: lint + test ──────────────────────────────────────────────────────
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck & Build
        run: npm run build

      - name: Run tests
        run: npm test
