        - heading "From first call to production" [level=2] [ref=f3e248]
      - generic [ref=f3e250]:
        - generic [ref=f3e255]:
          - generic [ref=f3e260]: Step 01
          - heading "Discovery" [level=3] [ref=f3e262]
          - paragraph [ref=f3e263]: I learn your business, your members, and your current technology landscape. Together we define what success looks like and build a roadmap to get there.
        - generic [ref=f3e268]:
          - generic [ref=f3e273]: Step 02
          - heading "Implementation" [level=3] [ref=f3e275]
          - paragraph [ref=f3e276]: Hands-on delivery — platform configuration, system integration, data migration, and custom development. I work alongside your team as part of the delivery, not just an advisor pointing at slides.
        - generic [ref=f3e279]:
          - generic [ref=f3e286]: Step 03
          - heading "Launch & Support" [level=3] [ref=f3e288]
          - paragraph [ref=f3e289]: Testing, training, go-live support, and post-launch optimization. I stay involved until the platform is running smoothly and your team is confident.
