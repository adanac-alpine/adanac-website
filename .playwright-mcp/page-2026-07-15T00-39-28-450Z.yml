        - text: How I Work
        - heading "From first call to production" [level=2] [ref=f140e248]
      - generic [ref=f140e250]:
        - generic [ref=f140e255]:
          - generic [ref=f140e260]: Step 01
          - heading "Discovery" [level=3] [ref=f140e262]
          - paragraph [ref=f140e263]: I learn your business, your members, and your current technology landscape. Together we define what success looks like and build a roadmap to get there.
        - generic [ref=f140e268]:
          - generic [ref=f140e273]: Step 02
          - heading "Implementation" [level=3] [ref=f140e275]
          - paragraph [ref=f140e276]: Hands-on delivery — platform configuration, system integration, data migration, and custom development. I work alongside your team as part of the delivery, not just an advisor pointing at slides.
        - generic [ref=f140e279]:
          - generic [ref=f140e286]: Step 03
          - heading "Launch & Support" [level=3] [ref=f140e288]
          - paragraph [ref=f140e289]: Testing, training, go-live support, and post-launch optimization. I stay involved until the platform is running smoothly and your team is confident.
