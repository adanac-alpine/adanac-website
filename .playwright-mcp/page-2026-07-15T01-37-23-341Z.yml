              - heading "Scoutloop" [level=2] [ref=f162e472]
          - paragraph [ref=f162e473]: "I spend as much time as I can in the BC backcountry — trailrunning, hiking, and ski touring. Scoutloop came from a real need: knowing what conditions actually look like before you drive three hours to a trailhead."
