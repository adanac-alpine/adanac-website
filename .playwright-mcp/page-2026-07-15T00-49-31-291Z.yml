      - generic [ref=f1e250]:
        - generic [ref=f1e255]:
          - generic [ref=f1e260]: Step 01
          - heading "Discovery" [level=3] [ref=f1e262]
          - paragraph [ref=f1e263]: I learn your business, your members, and your current technology landscape. Together we define what success looks like and build a roadmap to get there.
        - generic [ref=f1e268]:
