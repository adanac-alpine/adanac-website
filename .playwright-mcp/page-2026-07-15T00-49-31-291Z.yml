          - heading "Implementation" [level=3] [ref=f1e275]
          - paragraph [ref=f1e276]: Hands-on delivery — platform configuration, system integration, data migration, and custom development. I work alongside your team as part of the delivery, not just an advisor pointing at slides.
        - generic [ref=f1e279]:
          - generic [ref=f1e286]: Step 03
          - heading "Launch & Support" [level=3] [ref=f1e288]
          - paragraph [ref=f1e289]: Testing, training, go-live support, and post-launch optimization. I stay involved until the platform is running smoothly and your team is confident.
